<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Teacher Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>window.supabase||document.write('<script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"><\/script>')</script>
<style>
:root{--navy:#050b1f;--navy2:#0a1633;--blue:#1e6bff;--cyan:#00f0ff;--text:#e8f4ff;--mute:#8fa8c9;--bad:#ff4d6d;--ok:#2dffb0}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:radial-gradient(circle at 15% 10%,rgba(30,107,255,.38),transparent 45%),radial-gradient(circle at 88% 22%,rgba(0,240,255,.22),transparent 42%),radial-gradient(circle at 50% 100%,rgba(70,60,200,.30),transparent 55%),radial-gradient(rgba(150,200,255,.09) 1px,transparent 1.5px) 0 0/26px 26px,linear-gradient(160deg,#07122e,#050b1f 70%);background-attachment:fixed;color:var(--text);font-family:Rajdhani,system-ui,sans-serif;font-size:18px;line-height:1.4;overflow-x:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
main{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:76px 16px 24px}
.hidden{display:none!important}
h1,h2,h3{font-family:Orbitron,sans-serif;letter-spacing:.04em}
.glass{background:linear-gradient(145deg,rgba(20,45,100,.55),rgba(8,18,45,.7));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(0,240,255,.35);border-radius:20px;box-shadow:0 0 22px rgba(30,107,255,.35),inset 0 0 30px rgba(0,240,255,.06);padding:24px;width:100%}
.btn{font:700 1.05rem Rajdhani,sans-serif;letter-spacing:.06em;color:#001322;background:linear-gradient(135deg,var(--cyan),var(--blue));border:0;border-radius:12px;padding:12px 20px;cursor:pointer;box-shadow:0 0 16px rgba(0,240,255,.55),0 5px 0 #0a3d99;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 28px rgba(0,240,255,.9),0 7px 0 #0a3d99}
.btn:active{transform:translateY(3px);box-shadow:0 0 12px rgba(0,240,255,.6),0 2px 0 #0a3d99}
.btn:disabled{opacity:.5;cursor:wait}
.btn.ghost{background:transparent;color:var(--cyan);border:1px solid var(--cyan);box-shadow:none}
.btn.warn{background:linear-gradient(135deg,#ffb44d,#ff6b3d);box-shadow:0 4px 0 #8a3a10}
.btn.danger{background:linear-gradient(135deg,#ff6b8a,var(--bad));color:#fff;box-shadow:0 4px 0 #7a1630}
.btn.sm{padding:7px 12px;font-size:.92rem;box-shadow:none}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
label{display:block;margin:14px 0 6px;color:var(--mute);font-weight:600}
input[type=text],input[type=url],input[type=email],input[type=password],input[type=file]{width:100%;font:600 1rem Rajdhani,sans-serif;color:var(--text);background:rgba(3,8,24,.7);border:1px solid rgba(0,240,255,.3);border-radius:10px;padding:12px}
textarea{width:100%;font:600 1rem Rajdhani,sans-serif;color:var(--text);background:rgba(3,8,24,.7);border:1px solid rgba(0,240,255,.3);border-radius:10px;padding:12px;resize:vertical;min-height:90px}
input:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 12px rgba(0,240,255,.5);outline:0}
.msg{margin-top:12px;font-weight:600}.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
/* top bar */
.topbar-fixed{position:fixed;top:env(safe-area-inset-top);left:0;right:0;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;pointer-events:none}
.topbar-fixed>*{pointer-events:auto}
.topbtn{font:900 1.05rem Rajdhani,sans-serif;letter-spacing:.06em;color:#00101f;background:linear-gradient(135deg,#7ff8ff,var(--cyan) 45%,#3d8bff);border:2px solid #fff;border-radius:999px;padding:11px 22px;cursor:pointer;box-shadow:0 0 14px #fff,0 0 30px var(--cyan),0 0 60px rgba(30,107,255,.9);animation:hot 1.6s ease-in-out infinite;transition:transform .15s}
@keyframes hot{50%{box-shadow:0 0 22px #fff,0 0 50px var(--cyan),0 0 95px rgba(30,107,255,1);transform:scale(1.05)}}
.topbtn:hover{animation-play-state:paused;transform:scale(1.08)}
.madeby{margin-left:auto;font:900 .85rem Orbitron,sans-serif;letter-spacing:.08em;color:#fff;padding:8px 14px;border-radius:10px;background:rgba(10,30,80,.75);border:1px solid var(--cyan);text-shadow:0 0 10px var(--cyan);box-shadow:0 0 16px rgba(0,240,255,.6);animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 28px rgba(0,240,255,1)}}
@media (max-width:420px){.topbtn{font-size:.9rem;padding:9px 14px}.madeby{font-size:.72rem;padding:7px 10px}}
.chk{display:flex;align-items:center;gap:10px;color:var(--text);cursor:pointer}.chk input{appearance:none;-webkit-appearance:none;width:48px;height:27px;flex:none;border-radius:99px;background:#13224a;border:1px solid var(--cyan);position:relative;cursor:pointer;transition:.2s;padding:0}.chk input::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#8fa8c9;transition:.2s}.chk input:checked{background:var(--blue);box-shadow:0 0 12px var(--cyan)}.chk input:checked::after{left:25px;background:#fff}.opts{display:grid;gap:4px;margin-top:6px}
/* loader */
.loader{width:70px;height:70px;border-radius:50%;border:4px solid rgba(0,240,255,.15);border-top-color:var(--cyan);animation:spin 1s linear infinite;box-shadow:0 0 24px var(--cyan)}
@keyframes spin{to{transform:rotate(360deg)}}
/* invitation */
#invite{max-width:640px;text-align:center}
.inv-head{font-size:clamp(1.5rem,6.5vw,3rem);line-height:1.15;color:#fff;text-shadow:0 1px 0 #1e6bff,0 2px 0 #1857d1,0 3px 0 #1245a8,0 4px 0 #0e3685,0 8px 18px rgba(0,0,0,.6),0 0 28px var(--cyan);transform:perspective(600px) rotateX(10deg);animation:drop 1s cubic-bezier(.2,1.4,.4,1) both}
.inv-name{font:900 clamp(1.8rem,8vw,3.4rem) Orbitron,sans-serif;margin:14px 0 22px;color:var(--cyan);text-shadow:0 0 14px var(--cyan),0 0 40px var(--blue);word-break:break-word;animation:drop 1s .25s cubic-bezier(.2,1.4,.4,1) both}
.frame{position:relative;padding:4px;border-radius:22px;background:conic-gradient(from var(--a,0deg),var(--cyan),var(--blue),#fff,var(--cyan));animation:rot 4s linear infinite,pop 1s .5s both;box-shadow:0 0 36px rgba(0,240,255,.6)}
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes rot{to{--a:360deg}}
.frame img{display:block;width:100%;max-height:70vh;object-fit:contain;border-radius:18px;background:#030818}
@keyframes drop{from{opacity:0;transform:perspective(600px) translateY(-40px) rotateX(60deg)}}
@keyframes pop{from{opacity:0;transform:scale(.7)}}
.back{display:inline-block;margin-top:28px;font-size:1.45rem;font-weight:900;padding:18px 40px;border:2px solid #fff;background:linear-gradient(135deg,#7ff8ff,var(--cyan) 45%,#3d8bff);box-shadow:0 0 16px #fff,0 0 36px var(--cyan),0 0 70px rgba(30,107,255,.9),0 6px 0 #0a3d99;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 26px #fff,0 0 60px var(--cyan),0 0 110px rgba(30,107,255,1),0 6px 0 #0a3d99}}
.avatar{width:150px;height:150px;margin:22px auto 0;padding:4px;border-radius:50%;background:conic-gradient(from var(--a,0deg),var(--cyan),var(--blue),#fff,var(--cyan));animation:rot 4s linear infinite,pop 1s .3s both;box-shadow:0 0 34px rgba(0,240,255,.65)}
.avatar img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid #050b1f;background:#030818}
.divider{display:flex;align-items:center;gap:12px;margin:0 auto 20px;max-width:320px;color:var(--cyan);animation:pop 1s .35s both}
.divider span{flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent)}
.msgcard{margin-bottom:24px;font-size:1.3rem;line-height:1.6;white-space:pre-line;animation:pop 1s .45s both;border-color:rgba(0,240,255,.5)}
/* admin */
#admin{max-width:980px;align-self:stretch;margin:0 auto;justify-content:flex-start}
#login{max-width:420px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.topbar h2{font-size:clamp(1.1rem,4vw,1.6rem);color:var(--cyan);text-shadow:0 0 14px var(--cyan)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));margin-top:16px}
.card{padding:14px;display:flex;flex-direction:column;gap:8px}
.card img{width:100%;height:170px;object-fit:cover;border-radius:12px;background:#030818}
.card h3{font-size:1.05rem;word-break:break-word}
.pill{font-size:.85rem;font-weight:700;padding:2px 10px;border-radius:99px;width:fit-content}
.pill.on{background:rgba(45,255,176,.15);color:var(--ok)}.pill.off{background:rgba(255,77,109,.15);color:var(--bad)}
.row{display:flex;gap:6px;flex-wrap:wrap}
.small{color:var(--mute);font-size:.9rem;word-break:break-all}
.linkbox{margin-top:14px;padding:12px;border:1px dashed var(--cyan);border-radius:12px;word-break:break-all}
.modal{position:fixed;inset:0;z-index:20;background:rgba(2,6,18,.8);display:flex;padding:16px;overflow:auto}
.modal .glass{max-width:460px;margin:auto}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:60;padding:12px 20px;border-radius:12px;background:#0a1d44;border:1px solid var(--cyan);box-shadow:0 0 20px rgba(0,240,255,.5);font-weight:700}
.toast.bad{border-color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="topbar-fixed">
  <button class="topbtn hidden" id="topBtn">← Back to Website</button>
  <div class="madeby">MADE BY ZAIN</div>
</div>
<main>
  <div id="loading"><div class="loader" role="status" aria-label="Loading"></div></div>

  <!-- Teacher invitation -->
  <section id="invite" class="hidden">
    <h1 class="inv-head">YOU ARE SPECIALLY INVITED!</h1>
    <div class="avatar hidden" id="avatarWrap"><img id="personImg" alt="Invited guest"></div>
    <div class="inv-name" id="invName"></div>
    <div class="divider"><span></span><i>✦</i><span></span></div>
    <div class="msgcard glass hidden" id="msgCard"><p id="invMsg"></p></div>
    <div class="frame"><img id="invImg" alt="Invitation card"></div>
    <button class="btn back" id="backBtn">← BACK TO WEBSITE</button>
    <div class="msg bad" id="backErr"></div>
  </section>

  <!-- Invalid -->
  <section id="invalid" class="glass hidden" style="max-width:480px;text-align:center">
    <h2 style="color:var(--bad);margin-bottom:10px">Invitation unavailable</h2>
    <p>This invitation link is invalid or no longer active.</p>
  </section>

  <!-- Admin -->
  <section id="admin" class="hidden">
    <div id="login" class="glass hidden" style="margin:auto">
      <h2 style="color:var(--cyan);margin-bottom:6px">Admin login</h2>
      <p class="small">Sign in to manage teacher invitations.</p>
      <label for="email">Email</label><input type="email" id="email" autocomplete="username">
      <label for="pass">Password</label><input type="password" id="pass" autocomplete="current-password">
      <button class="btn" id="loginBtn" style="margin-top:18px;width:100%">Sign in</button>
      <div class="msg bad" id="loginMsg"></div>
    </div>

    <div id="dash" class="hidden">
      <div class="topbar"><h2>⚡ Invitation dashboard</h2><button class="btn ghost sm" id="logout">Sign out</button></div>
      <div class="glass">
        <h3 style="margin-bottom:4px">Create new teacher invitation</h3>
        <label for="cName">Teacher name</label><input type="text" id="cName" maxlength="120">
        <label for="cImg">Invitation card image</label><input type="file" id="cImg" accept="image/png,image/jpeg,image/webp">
        <label for="cPerson">Invited person's photo (optional)</label><input type="file" id="cPerson" accept="image/png,image/jpeg,image/webp">
        <label for="cText">Invitation text (optional)</label><textarea id="cText" maxlength="600" placeholder="Write your message for this teacher…"></textarea>
        <label for="cUrl">Main website URL</label><input type="url" id="cUrl" placeholder="https://YOUR-MAIN-PICNIC-WEBSITE.vercel.app">
        <div class="opts">
        <label class="chk"><input type="checkbox" id="cShowPerson" checked> Show person's photo</label>
        <label class="chk"><input type="checkbox" id="cShowText" checked> Show invitation text</label>
        <label class="chk"><input type="checkbox" id="cBack" checked> Show "Back to Website" button</label>
        </div>
        <button class="btn" id="cBtn" style="margin-top:18px">Generate invitation link</button>
        <div class="msg" id="cMsg"></div>
        <div class="linkbox hidden" id="cLink"><div id="cLinkText"></div><button class="btn sm" id="cCopy" style="margin-top:10px">Copy invitation link</button></div>
      </div>
      <h3 style="margin-top:26px">All invitations</h3>
      <div class="grid" id="list"></div>
      <p class="small" id="empty" style="margin-top:12px"></p>
    </div>
  </section>
</main>

<div class="modal hidden" id="modal">
  <div class="glass" role="dialog" aria-modal="true" aria-label="Edit invitation">
    <h3 style="color:var(--cyan)">Edit invitation</h3>
    <label for="eName">Teacher name</label><input type="text" id="eName" maxlength="120">
    <label for="eUrl">Main website URL</label><input type="url" id="eUrl">
    <div class="opts">
      <label class="chk"><input type="checkbox" id="eShowPerson"> Show person's photo</label>
      <label class="chk"><input type="checkbox" id="eShowText"> Show invitation text</label>
      <label class="chk"><input type="checkbox" id="eBack"> Show "Back to Website" button</label>
    </div>
    <label for="eImg">Replace invitation card image (optional)</label><input type="file" id="eImg" accept="image/png,image/jpeg,image/webp">
    <label for="ePerson">Person's photo (upload to add or replace)</label><input type="file" id="ePerson" accept="image/png,image/jpeg,image/webp">
    <label for="eText">Invitation text</label><textarea id="eText" maxlength="600"></textarea>
    <div class="row" style="margin-top:18px"><button class="btn" id="eSave">Save changes</button><button class="btn ghost" id="eCancel">Cancel</button></div>
    <div class="msg bad" id="eMsg"></div>
  </div>
</div>

<script>
/* ====== CONFIG: paste your values (anon / publishable key ONLY, never service_role) ====== */
const SUPABASE_URL = "https://yzcycwogydknngawgovp.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_9yfxnK8d0GtJWeWd4_DfzQ_nk1mPIav";
const DEFAULT_MAIN_URL = "https://collection-for-picnik2026.vercel.app/"; // used if an invitation has no URL saved
const BUCKET = "picnic-gallery", FOLDER = "teacher-invitations";

const $ = id => document.getElementById(id);
const show = id => { ["loading","invite","invalid","admin"].forEach(s => $(s).classList.toggle("hidden", s !== id)); };
const stillLoading = () => !$("loading").classList.contains("hidden");
function fail(msg){ if(!stillLoading()) return; show("invalid"); $("invalid").querySelector("h2").textContent="Something went wrong"; $("invalid").querySelector("p").textContent=msg; }
addEventListener("error",e=>fail("Error: "+(e.message||"unknown")));
addEventListener("unhandledrejection",e=>fail("Error: "+((e.reason&&e.reason.message)||e.reason)));
setTimeout(()=>fail("Taking too long to connect. Check your internet connection and reload the page."),12000);
let sb;
try{ sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }
catch(e){ fail("Could not load the Supabase library. Check your internet connection and reload."); }

function toast(t, bad){ const d=document.createElement("div"); d.className="toast"+(bad?" bad":""); d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2800); }
function cleanUrl(u){ try{ const x=new URL((u||"").trim()); return /^https?:$/.test(x.protocol)?x.href:null; }catch{ return null; } }
function makeToken(){ const a=new Uint8Array(24); crypto.getRandomValues(a); return btoa(String.fromCharCode(...a)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
const linkFor = t => location.origin + location.pathname + "?invite=" + encodeURIComponent(t);
async function copy(t){ try{ await navigator.clipboard.writeText(t); toast("Link copied"); }catch{ prompt("Copy this link:", t); } }

/* ====== Canvas size (confetti) ====== */
let W,H; const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function size(){ W=$("fx").width=innerWidth; H=$("fx").height=innerHeight; }
addEventListener("resize",size); size();

/* ====== Confetti + party poppers ====== */
const fx=$("fx").getContext("2d"); let parts=[],fxOn=false;
function burst(x,y,ang,n){ const cols=["#00f0ff","#1e6bff","#ffffff","#ffd84d","#ff5fa2","#2dffb0"];
  for(let i=0;i<n;i++){ const a=ang+(Math.random()-.5)*1.1, s=8+Math.random()*14;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,w:6+Math.random()*6,h:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],life:140+Math.random()*60}); }
  if(!fxOn){fxOn=true;tick();} }
function tick(){ fx.clearRect(0,0,W,H);
  parts=parts.filter(p=>p.life>0&&p.y<H+30);
  for(const p of parts){ p.vy+=.35; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life--;
    fx.save(); fx.translate(p.x,p.y); fx.rotate(p.r); fx.fillStyle=p.c; fx.globalAlpha=Math.min(1,p.life/40); fx.fillRect(-p.w/2,-p.h/2,p.w,p.h); fx.restore(); }
  if(parts.length) requestAnimationFrame(tick); else fxOn=false; }
function party(){ if(reduce) return;
  const go=()=>{ burst(0,H,-1.0,90); burst(W,H,-Math.PI+1.0,90); burst(W/2,H,-Math.PI/2,70); };
  go(); setTimeout(go,900); setTimeout(go,2000); }

/* ====== Teacher invitation page ====== */
async function showInvite(token){
  show("loading"); $("topBtn").classList.add("hidden");
  const {data,error}=await sb.rpc("get_invitation",{p_token:token});
  const row=Array.isArray(data)?data[0]:data;
  if(error||!row){ show("invalid"); return; }
  $("invName").textContent=row.teacher_name;
  const pi=$("personImg"), aw=$("avatarWrap");
  if(row.person_image_url){ pi.onerror=()=>aw.classList.add("hidden"); pi.src=row.person_image_url; aw.classList.remove("hidden"); } else aw.classList.add("hidden");
  if(row.message_text&&row.message_text.trim()){ $("invMsg").textContent=row.message_text; $("msgCard").classList.remove("hidden"); } else $("msgCard").classList.add("hidden");
  const img=$("invImg"); img.onerror=()=>img.closest(".frame").classList.add("hidden"); img.src=row.image_url||"";
  const goMain=()=>{ const u=cleanUrl(row.main_website_url)||cleanUrl(DEFAULT_MAIN_URL);
    if(!u){ $("backErr").textContent="The website link is not set for this invitation. Please contact the organizer."; return; }
    location.href=u; };
  const showBack=row.show_back_button!==false;
  $("backBtn").onclick=goMain; $("topBtn").onclick=goMain;
  $("topBtn").classList.toggle("hidden",!showBack); $("backBtn").classList.toggle("hidden",!showBack);
  show("invite"); party();
}

/* ====== Admin ====== */
let editing=null;
async function isAdmin(){ const {data,error}=await sb.rpc("is_invitation_admin"); return !error&&data===true; }
async function showAdmin(){
  show("admin");
  const {data:{session}}=await sb.auth.getSession();
  if(session && await isAdmin()){ $("login").classList.add("hidden"); $("dash").classList.remove("hidden"); loadList(); }
  else { if(session){ await sb.auth.signOut(); $("loginMsg").textContent="This account is not an authorized admin."; } $("dash").classList.add("hidden"); $("login").classList.remove("hidden"); }
}
$("loginBtn").onclick=async()=>{ $("loginMsg").textContent="";
  const {error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("pass").value});
  if(error){ $("loginMsg").textContent="Login failed. Check your email and password."; return; }
  $("pass").value=""; showAdmin(); };
$("pass").addEventListener("keydown",e=>{ if(e.key==="Enter") $("loginBtn").click(); });
$("logout").onclick=async()=>{ await sb.auth.signOut(); showAdmin(); };

function validImage(f){ if(!f) return "Choose an invitation image."; if(!/^image\/(png|jpeg|webp)$/.test(f.type)) return "Image must be PNG, JPG or WebP."; if(f.size>8*1024*1024) return "Image must be under 8 MB."; return null; }
async function upload(file,token,tag="card"){ const ext={"image/png":"png","image/jpeg":"jpg","image/webp":"webp"}[file.type];
  const path=`${FOLDER}/${token}-${tag}-${Date.now()}.${ext}`;
  const {error}=await sb.storage.from(BUCKET).upload(path,file,{contentType:file.type,upsert:false});
  if(error) throw error;
  return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl; }
function pathFromUrl(u){ const m=(u||"").split(`/${BUCKET}/`); return m[1]?decodeURIComponent(m[1].split("?")[0]):null; }
async function removeImage(u){ const p=pathFromUrl(u); if(p) await sb.storage.from(BUCKET).remove([p]); }

$("cBtn").onclick=async()=>{
  const name=$("cName").value.trim(), file=$("cImg").files[0], url=cleanUrl($("cUrl").value), showBack=$("cBack").checked, pfile=$("cPerson").files[0], text=$("cText").value.trim(), showPerson=$("cShowPerson").checked, showText=$("cShowText").checked, m=$("cMsg");
  m.className="msg bad";
  if(!name){ m.textContent="Enter the teacher's name."; return; }
  const ie=validImage(file); if(ie){ m.textContent=ie; return; }
  if(pfile){ const pe=validImage(pfile); if(pe){ m.textContent="Person photo: "+pe; return; } }
  if(showBack && !url){ m.textContent="Enter a valid Main Website URL starting with https://, or turn off the Back to Website button."; return; }
  $("cBtn").disabled=true; m.className="msg"; m.textContent="Uploading…";
  try{
    const token=makeToken(), image_url=await upload(file,token,"card");
    const person_image_url=pfile?await upload(pfile,token,"person"):null;
    const {error}=await sb.from("teacher_invitations").insert({teacher_name:name,token,image_url,main_website_url:url,show_back_button:showBack,person_image_url,message_text:text||null,show_person_photo:showPerson,show_message:showText,active:true});
    if(error){ await removeImage(image_url); await removeImage(person_image_url); throw error; }
    m.className="msg ok"; m.textContent="Invitation created.";
    const l=linkFor(token); $("cLinkText").textContent=l; $("cLink").classList.remove("hidden"); $("cCopy").onclick=()=>copy(l);
    $("cName").value=""; $("cImg").value=""; $("cUrl").value=DEFAULT_MAIN_URL; $("cBack").checked=true; $("cPerson").value=""; $("cText").value=""; $("cShowPerson").checked=true; $("cShowText").checked=true; loadList();
  }catch(e){ m.className="msg bad"; m.textContent="Could not save: "+(e.message||e); }
  $("cBtn").disabled=false; };

async function loadList(){
  const {data,error}=await sb.from("teacher_invitations").select("*").order("created_at",{ascending:false});
  const list=$("list"); list.replaceChildren();
  if(error){ $("empty").textContent="Could not load invitations: "+error.message; return; }
  $("empty").textContent=data.length?"":"No invitations yet. Create the first one above.";
  for(const r of data){
    const c=document.createElement("div"); c.className="glass card";
    const im=document.createElement("img"); im.src=r.image_url||""; im.alt="Invitation preview"; im.loading="lazy";
    const h=document.createElement("h3"); h.textContent=r.teacher_name;
    const st=document.createElement("span"); st.className="pill "+(r.active?"on":"off"); st.textContent=r.active?"Active":"Inactive";
    const d=document.createElement("div"); d.className="small"; d.textContent="Created "+new Date(r.created_at).toLocaleString();
    const w=document.createElement("div"); w.className="small"; w.textContent=`Photo: ${!r.person_image_url?"none":r.show_person_photo===false?"OFF":"ON"} · Text: ${!r.message_text?"none":r.show_message===false?"OFF":"ON"} · Back button: ${r.show_back_button===false?"OFF":"ON"} · `+(r.main_website_url||"No website URL set");
    const row=document.createElement("div"); row.className="row";
    const b=(t,cls,fn)=>{ const x=document.createElement("button"); x.className="btn sm "+cls; x.textContent=t; x.onclick=fn; row.appendChild(x); };
    b("Copy link","",()=>copy(linkFor(r.token)));
    b("Edit","ghost",()=>openEdit(r));
    b(r.show_back_button===false?"Turn back button ON":"Turn back button OFF","ghost",async()=>{ const {error}=await sb.from("teacher_invitations").update({show_back_button:r.show_back_button===false}).eq("id",r.id); if(error) toast(error.message,true); else { toast("Saved"); loadList(); } });
    const qt=(name,col,cur)=>b("Turn "+name+(cur?" OFF":" ON"),"ghost",async()=>{ const {error}=await sb.from("teacher_invitations").update({[col]:!cur}).eq("id",r.id); if(error) toast(error.message,true); else { toast("Saved"); loadList(); } });
    if(r.person_image_url) qt("photo","show_person_photo",r.show_person_photo!==false);
    if(r.message_text) qt("text","show_message",r.show_message!==false);
    b(r.active?"Deactivate":"Activate","warn",async()=>{ const {error}=await sb.from("teacher_invitations").update({active:!r.active}).eq("id",r.id); if(error) toast(error.message,true); else { toast(r.active?"Deactivated":"Activated"); loadList(); } });
    b("Delete","danger",async()=>{ if(!confirm(`Delete the invitation for ${r.teacher_name}? The link will stop working.`)) return;
      const {error}=await sb.from("teacher_invitations").delete().eq("id",r.id);
      if(error){ toast(error.message,true); return; } await removeImage(r.image_url); await removeImage(r.person_image_url); toast("Deleted"); loadList(); });
    c.append(im,h,st,d,w,row); list.appendChild(c);
  }
}

function openEdit(r){ editing=r; $("eName").value=r.teacher_name; $("eUrl").value=r.main_website_url||""; $("eBack").checked=r.show_back_button!==false; $("eShowPerson").checked=r.show_person_photo!==false; $("eShowText").checked=r.show_message!==false; $("eText").value=r.message_text||""; $("ePerson").value=""; $("eImg").value=""; $("eMsg").textContent=""; $("modal").classList.remove("hidden"); $("eName").focus(); }
$("eCancel").onclick=()=>$("modal").classList.add("hidden");
$("eSave").onclick=async()=>{
  const name=$("eName").value.trim(), url=cleanUrl($("eUrl").value), file=$("eImg").files[0], pfile=$("ePerson").files[0], text=$("eText").value.trim(), m=$("eMsg");
  if(!name){ m.textContent="Enter the teacher's name."; return; }
  const back=$("eBack").checked;
  if(back && !url){ m.textContent="Enter a valid URL starting with https://, or turn off the Back to Website button."; return; }
  if(file){ const ie=validImage(file); if(ie){ m.textContent=ie; return; } }
  if(pfile){ const pe=validImage(pfile); if(pe){ m.textContent="Person photo: "+pe; return; } }
  $("eSave").disabled=true; m.textContent="";
  try{
    const patch={teacher_name:name,main_website_url:url,show_back_button:back,message_text:text||null,show_person_photo:$("eShowPerson").checked,show_message:$("eShowText").checked}; let old=null, oldP=null;
    if(file){ patch.image_url=await upload(file,editing.token,"card"); old=editing.image_url; }
    if(pfile){ patch.person_image_url=await upload(pfile,editing.token,"person"); oldP=editing.person_image_url; }
    const {error}=await sb.from("teacher_invitations").update(patch).eq("id",editing.id);
    if(error) throw error;
    if(old) await removeImage(old);
    if(oldP) await removeImage(oldP);
    $("modal").classList.add("hidden"); toast("Saved"); loadList();
  }catch(e){ m.textContent="Could not save: "+(e.message||e); }
  $("eSave").disabled=false; };

/* ====== Start ====== */
(function(){
  if(SUPABASE_URL.startsWith("YOUR_")){ show("invalid"); $("invalid").querySelector("p").textContent="Set SUPABASE_URL and SUPABASE_ANON_KEY at the top of the script in index.html."; return; }
  $("cUrl").value=DEFAULT_MAIN_URL;
  if(!sb) return;
  const t=new URLSearchParams(location.search).get("invite");
  try{ if(t) showInvite(t.trim()).catch(e=>fail("Error: "+(e.message||e))); else showAdmin().catch(e=>fail("Error: "+(e.message||e))); }
  catch(e){ fail("Error: "+(e.message||e)); }
})();
</script>
